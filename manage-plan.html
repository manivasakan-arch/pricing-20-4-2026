<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Presentations AI — Manage Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
      colors: {
        brand: { 50: '#eef2f6', 100: '#d4dae2', 500: '#0A1925' },
        ink: { primary: '#171717', secondary: '#525252', tertiary: '#a3a3a3' },
        success: { bg: '#dcfce7', fg: '#16a34a' },
      },
    } },
  };
</script>
<style>
  html, body { background: #f4f5f7; color: #171717; font-family: 'Inter', system-ui, sans-serif; }
  .usd { font-size: 1em; font-weight: inherit; vertical-align: baseline; margin-right: 0; letter-spacing: 0; }

  /* ── Proto state switcher (dev affordance) ─────────────── */
  .proto-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .proto-pill {
    height: 32px; padding: 0 14px; border-radius: 999px;
    border: 1px solid #E4E7EC; background: #fff; color: #525252;
    font-size: 12.5px; font-weight: 600; cursor: pointer; transition: all .15s ease;
  }
  .proto-pill:hover { border-color: #B0B7C3; }
  .proto-pill.is-active { background: #0A1925; border-color: #0A1925; color: #fff; }

  /* ── Modal frame ───────────────────────────────────────── */
  .modal {
    position: relative; background: #fff; border-radius: 20px;
    box-shadow: 0 24px 60px rgba(16,24,40,.14), 0 4px 12px rgba(16,24,40,.06);
    max-width: 1180px; margin: 0 auto; padding: 40px 36px 28px;
  }
  .modal-x {
    position: absolute; top: 22px; right: 22px;
    width: 38px; height: 38px; border-radius: 999px;
    border: 1px solid #E4E7EC; background: #fff; color: #475467;
    display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer;
    transition: background .15s ease;
  }
  .modal-x:hover { background: #F2F4F7; }

  .cur-banner {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 18px; border-radius: 999px;
    background: #ECFDF3; color: #067647; font-size: 14px; font-weight: 600;
  }

  .upgrade-note {
    max-width: 720px; margin: 22px auto 0; text-align: center;
    display: flex; align-items: flex-start; justify-content: center; gap: 8px;
    font-size: 13px; line-height: 1.5; color: #475467;
  }
  .upgrade-note.hidden { display: none; }

  /* ── Individual / Team segmented toggle ────────────────── */
  .view-seg { display: inline-flex; padding: 4px; background: #F2F4F7; border-radius: 999px; }
  .view-seg-btn {
    display: inline-flex; align-items: center; gap: 7px;
    height: 36px; padding: 0 18px; border-radius: 999px;
    font-size: 13.5px; font-weight: 600; color: #667085; cursor: pointer;
  }
  .view-seg-btn.is-active { background: #fff; color: #0A1925; box-shadow: 0 1px 2px rgba(16,24,40,.12); }

  /* ── Plan cards ────────────────────────────────────────── */
  .pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; align-items: stretch; justify-content: center; }
  .pcard {
    position: relative; display: flex; flex-direction: column;
    background: #fff; border: 1px solid #E4E7EC; padding: 28px 26px;
  }
  .pcard + .pcard { border-left: 0; }
  .pgrid > .pcard:first-child { border-top-left-radius: 14px; border-bottom-left-radius: 14px; }
  .pgrid > .pcard:last-child  { border-top-right-radius: 14px; border-bottom-right-radius: 14px; }
  .pcard.is-rec { border: 2px solid #0A1925; border-radius: 14px; z-index: 2; }
  .pcard.is-current { background: #FAFBFC; }
  .pcard-badge {
    position: absolute; top: -11px; left: 26px; padding: 4px 12px; border-radius: 999px;
    background: #0A1925; color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .02em;
  }
  .pcard-cur-tag {
    position: absolute; top: -11px; left: 26px; padding: 4px 12px; border-radius: 999px;
    background: #ECFDF3; color: #067647; font-size: 11px; font-weight: 700; letter-spacing: .02em;
  }
  .pcard-glyph { font-size: 30px; line-height: 1; }
  .pcard h3 { font-size: 24px; font-weight: 700; color: #171717; line-height: 1; }
  .pcard-cta {
    width: 100%; height: 46px; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer;
    transition: opacity .15s ease, background .15s ease;
  }
  .pcard-cta.primary { background: #0A1925; color: #fff; }
  .pcard-cta.primary:hover { opacity: .9; }
  .pcard-cta.ghost { background: #fff; color: #0A1925; border: 1px solid #0A1925; }
  .pcard-cta.ghost:hover { background: #F8FAFC; }
  .pcard-cta.disabled { background: #F2F4F7; color: #98A2B3; cursor: default; }
  .feat { display: flex; align-items: flex-start; gap: 9px; font-size: 14px; color: #525252; line-height: 1.43; }
  .feat i { font-size: 19px; color: #525252; flex: none; line-height: 1.2; }
  .feat-credits { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .feat-head { font-weight: 600; color: #171717; }
  .mp-flag {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 8px;
    background: #FEF3F2; color: #B42318; font-size: 12px; font-weight: 600;
  }

  /* ── Monthly/Annual seg (per card) ─────────────────────── */
  .mseg { display: inline-flex; padding: 3px; background: #F2F4F7; border-radius: 999px; }
  .mseg-btn { height: 28px; padding: 0 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: #667085; cursor: pointer; }
  .mseg-btn.is-active { background: #fff; color: #0A1925; box-shadow: 0 1px 2px rgba(16,24,40,.1); }

  /* ── Credit dropdown (from v6) ─────────────────────────── */
  .credit-dd { position: relative; width: 100%; }
  .credit-dd-trigger {
    width: 100%; height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 0 12px; border: 1px solid #D0D5DD; border-radius: 8px;
    background: #fff; color: #0A1925; font-size: 14px; font-weight: 600; font-family: inherit;
    cursor: pointer; text-align: left; transition: border-color .15s ease;
  }
  .credit-dd-trigger:hover { border-color: #B0B7C3; }
  .credit-dd.is-open .credit-dd-trigger { border-color: #0A1925; }
  .credit-dd-caret { color: #667085; font-size: 14px; transition: transform .15s ease; }
  .credit-dd.is-open .credit-dd-caret { transform: rotate(180deg); }
  .credit-dd-menu {
    position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 30;
    margin: 0; padding: 6px; list-style: none;
    background: #fff; border: 1px solid #E4E7EC; border-radius: 10px;
    box-shadow: 0 12px 28px rgba(16,24,40,.14), 0 2px 6px rgba(16,24,40,.06); display: none;
  }
  .credit-dd.is-open .credit-dd-menu { display: block; }
  .credit-dd-opt {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 9px 10px; border-radius: 7px; font-size: 14px; font-weight: 600; color: #0A1925; cursor: pointer;
  }
  .credit-dd-opt:hover, .credit-dd-opt.is-active, .credit-dd-opt[aria-selected="true"] { background: #F2F4F7; }
  .credit-dd-pill {
    flex: none; padding: 3px 10px; border-radius: 999px;
    background: #ECFDF3; color: #067647; font-size: 12px; font-weight: 600; line-height: 1;
  }
  .credit-dd-left, .credit-dd-optlabel { display: flex; align-items: center; gap: 8px; min-width: 0; }

  /* ── Credits tooltip (from v6) ─────────────────────────── */
  .credit-tip { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; font-size: 14px; color: #a3a3a3; cursor: help; }
  .credit-tip__bub {
    position: absolute; left: calc(100% + 12px); top: 50%; transform: translateY(-50%) scale(.96); transform-origin: left center;
    width: max-content; max-width: 240px; background: #1d1d1f; color: #fff;
    font-size: 12px; font-weight: 400; line-height: 1.4; text-align: left;
    padding: 12px 16px; border-radius: 14px; box-shadow: 0 14px 34px rgba(0,0,0,.24);
    opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .14s ease, transform .14s ease; z-index: 60;
  }
  .credit-tip__bub::before { content: ""; position: absolute; left: -4px; top: 50%; transform: translateY(-50%) rotate(45deg); width: 12px; height: 12px; background: #1d1d1f; border-radius: 3px; }
  .credit-tip:hover .credit-tip__bub, .credit-tip:focus-within .credit-tip__bub { opacity: 1; visibility: visible; transform: translateY(-50%) scale(1); }

  /* ── Animated "Unlimited seats" gradient (from v6) ─────── */
  .unlimited-grad {
    background: linear-gradient(90deg, #002464, #0059ff, #0095ff, #b6daff, #0095ff, #0059ff, #002464);
    background-size: 200% auto; -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent; background-position: 200% center;
    animation: unlimited-grad-move 3.5s linear infinite;
  }
  @keyframes unlimited-grad-move { from { background-position: 200% center; } to { background-position: 0% center; } }
  @media (prefers-reduced-motion: reduce) { .unlimited-grad { animation: none; } }

  /* ── Lock panel (team → no individual) ─────────────────── */
  .lock-panel {
    grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    border: 1px dashed #D0D5DD; border-radius: 14px; background: #FAFBFC; padding: 48px 24px; text-align: center;
  }
  .lock-panel i { font-size: 30px; color: #98A2B3; }

  /* ── Trust strip (enterprise) ──────────────────────────── */
  .trust-cap { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #a3a3a3; text-align: center; }

  /* ── Footer marquee ────────────────────────────────────── */
  .footer { max-width: 1180px; margin: 28px auto 0; padding: 8px 12px; }
  .sp-wrap { position: relative; overflow: hidden; flex: 1; height: 48px; }
  .sp-track { position: absolute; left: 0; top: 0; display: flex; align-items: center; height: 40px; width: max-content; gap: 32px; animation: sp-scroll 32s linear infinite; }
  .sp-logo-img { height: 26px; width: auto; opacity: .7; }
  @keyframes sp-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  @media (max-width: 880px) {
    .pgrid { grid-template-columns: 1fr; }
    .pcard { border-radius: 14px !important; border-left: 1px solid #E4E7EC !important; }
    .pcard + .pcard { margin-top: 14px; }
    .modal { padding: 32px 18px 22px; }
  }
</style>
</head>
<body>
  <div class="max-w-[1180px] mx-auto px-5 pt-6 pb-2">
    <div class="proto-bar">
      <span class="text-[12px] font-semibold text-ink-tertiary uppercase tracking-wide mr-1">Preview current plan</span>
      <button class="proto-pill is-active" data-state="pro-ind">Pro · Individual</button>
      <button class="proto-pill" data-state="gold-ind">Gold · Individual</button>
      <button class="proto-pill" data-state="pro-team">Pro · Team</button>
      <button class="proto-pill" data-state="gold-team">Gold · Team</button>
    </div>
  </div>

  <div class="px-5 pb-10">
    <div class="modal">
      <button class="modal-x" aria-label="Close"><i class="ph ph-x"></i></button>
      <h1 class="text-[28px] font-extrabold text-ink-primary text-center tracking-tight">Manage your plan</h1>
      <div class="flex justify-center mt-4">
        <span class="cur-banner"><span aria-hidden="true">🔥</span><span id="cur-banner-text"></span></span>
      </div>

      <div class="flex justify-center mt-6" id="view-toggle-wrap">
        <div class="view-seg" role="tablist" aria-label="Plan type">
          <button class="view-seg-btn is-active" data-view="individual" role="tab"><i class="ph-bold ph-user"></i>Individual</button>
          <button class="view-seg-btn" data-view="team" role="tab"><i class="ph-bold ph-users-three"></i>Teams &amp; Enterprise</button>
        </div>
      </div>

      <div class="pgrid mt-8" id="cards"></div>

      <p class="upgrade-note hidden" id="upgrade-note">
        <span aria-hidden="true">ℹ️</span>
        Your current AI credits carry forward and are added to your new team pool.
        No proration: you pay the full team price for the credits you pick, and renew at the team price next year.
      </p>
    </div>

    <!-- Social-proof footer -->
    <aside class="footer" aria-label="Trusted by">
      <div class="flex items-center gap-4">
        <p class="shrink-0 whitespace-nowrap uppercase text-ink-secondary" style="font-size:13px; font-weight:600; letter-spacing:.04em;">
          <span aria-hidden="true">♥</span> Loved by 10M+ presenters at
        </p>
        <div class="sp-wrap">
          <div class="sp-track">
            <img class="sp-logo-img" src="assets/export-ppt/logos/microsoftlogo.svg" alt="Microsoft">
            <img class="sp-logo-img" src="assets/export-ppt/logos/googlelogo.svg" alt="Google">
            <img class="sp-logo-img" src="assets/export-ppt/logos/adobelogo.svg" alt="Adobe">
            <img class="sp-logo-img" src="assets/export-ppt/logos/facebooklogo.svg" alt="Meta">
            <img class="sp-logo-img" src="assets/export-ppt/logos/mckinseylogo.svg" alt="McKinsey">
            <img class="sp-logo-img" src="assets/export-ppt/logos/amazonlogo.svg" alt="Amazon">
            <img class="sp-logo-img" src="assets/export-ppt/logos/notionlogo.svg" alt="Notion">
            <img class="sp-logo-img" src="assets/export-ppt/logos/microsoftlogo.svg" alt="" aria-hidden="true">
            <img class="sp-logo-img" src="assets/export-ppt/logos/googlelogo.svg" alt="" aria-hidden="true">
            <img class="sp-logo-img" src="assets/export-ppt/logos/adobelogo.svg" alt="" aria-hidden="true">
            <img class="sp-logo-img" src="assets/export-ppt/logos/facebooklogo.svg" alt="" aria-hidden="true">
            <img class="sp-logo-img" src="assets/export-ppt/logos/mckinseylogo.svg" alt="" aria-hidden="true">

            <img class="sp-logo-img" src="assets/export-ppt/logos/notionlogo.svg" alt="" aria-hidden="true">
          </div>
        </div>
      </div>
    </aside>
  </div>

  <script>
    (function () {
      // ── Pricing data ────────────────────────────────────────────────────
      const UNIT = 5000;
      const CREDIT_OPTIONS = [15000, 25000, 50000, 75000, 100000];
      const OFFERS = { 15000: 0.10, 25000: 0.20, 50000: 0.30, 75000: 0.40, 100000: 0.50 };
      const LIST = { pro: 20, gold: 99 };               // per-unit annual rate
      const offerFor = c => OFFERS[c] || 0;

      const teamAnnualMo = (plan, c) => Math.floor((c / UNIT) * LIST[plan] * (1 - offerFor(c)));
      const teamListMo   = (plan, c) => (c / UNIT) * LIST[plan];

      const INDIV = {
        pro:  { name: 'Pro',  glyph: '✈️', annual: 20,  monthly: 40,  cA: 5000,  cM: 1000,
                feats: [['head', 'All Free features, plus:'], ['ph-star-four', 'Advanced AI models and agents'], ['ph-chart-bar', 'Presentation tracking & analytics'], ['ph-paint-brush-broad', 'Basic brand customization']] },
        gold: { name: 'Gold', glyph: '🚀', annual: 100, monthly: 200, cA: 50000, cM: 5000,

      let uid = 0;
      const cardsEl = document.getElementById('cards');

      // ── Build an individual plan card (seat stepper + M/A) ───────────────
      function buildIndividualCard(planKey, role) {
        const p = INDIV[planKey];
        const hasMonthly = planKey === 'gold';   // Pro is annual-only
        const el = document.createElement('div');
        el.className = 'pcard' + (role === 'current' ? ' is-current' : '') + (role === 'upgrade' ? ' is-rec' : '');
        const tag = role === 'current'
          ? `<span class="pcard-cur-tag">Current plan</span>`
          : (role === 'upgrade' ? `<span class="pcard-badge">Recommended</span>` : '');

        el.innerHTML = `
          ${tag}
          <div class="flex items-center justify-between mb-4" style="min-height:34px">
            <span class="pcard-glyph">${p.glyph}</span>
            ${hasMonthly ? `<div class="mseg" data-mseg>
              <button class="mseg-btn" data-period="monthly">Monthly</button>
              <button class="mseg-btn is-active" data-period="annual">Annual</button>
            </div>` : ''}
          </div>
          <div class="flex items-baseline justify-between gap-2">
            <h3>${p.name}</h3>
            <div class="text-right" data-price></div>
          </div>
          <div class="mt-6">
            <button class="pcard-cta ${role === 'current' ? 'disabled' : (role === 'upgrade' ? 'primary' : 'ghost')}" ${role === 'current' ? 'disabled' : ''} data-cta></button>
          </div>
          <div class="flex flex-col gap-3.5 mt-6">
            <p class="feat-credits"><span style="display:inline-flex">${SPARK}</span><span data-credits class="font-semibold text-ink-primary"></span><span class="text-ink-secondary">Credits</span></p>
            ${featsHTML(p.feats)}
          </div>`;

        cardsEl.appendChild(el);

        let period = 'annual';
        const priceEl = el.querySelector('[data-price]');
        const creditsEl = el.querySelector('[data-credits]');
        const ctaEl = el.querySelector('[data-cta]');
        const segBtns = Array.from(el.querySelectorAll('[data-mseg] .mseg-btn'));

        ctaEl.textContent = role === 'current' ? 'Current Plan'
          : role === 'upgrade' ? `Upgrade to ${p.name}` : `Switch to ${p.name}`;

        function render() {
          const total = period === 'annual' ? p.annual : p.monthly;
          const credits = period === 'annual' ? p.cA : p.cM;
          const cadence = period === 'annual'
            ? `1 user · $${(total * 12).toLocaleString()} billed annually`
            : '1 user · billed monthly';
          priceEl.innerHTML = `
            <div class="flex items-baseline gap-1 justify-end">
              <p class="text-[26px] font-bold text-ink-primary leading-none"><span class="usd">$</span>${total.toLocaleString()}</p>
              <span class="text-[13px] font-medium text-ink-tertiary">/mo</span>
            </div>
            <p class="text-[12px] font-medium text-ink-tertiary mt-1">${cadence}</p>`;
          creditsEl.textContent = credits.toLocaleString();
          segBtns.forEach(b => b.classList.toggle('is-active', b.dataset.period === period));
        }
        segBtns.forEach(b => b.addEventListener('click', () => { period = b.dataset.period; render(); }));
        render();
      }

      // ── Build a team plan card (credit pool + M/A) ───────────────────────
      function buildTeamCard(planKey, cfg) {
        const name = planKey === 'pro' ? 'Pro Team' : 'Gold Team';
        const glyph = planKey === 'pro' ? '✈️' : '🚀';
        const hasMonthly = planKey === 'gold';   // Pro Team is annual-only
        const options = cfg.mode === 'more' ? CREDIT_OPTIONS.filter(c => c >= cfg.owned) : CREDIT_OPTIONS.slice();
        let credits = cfg.mode === 'more' ? cfg.owned : options[0];
        let period = 'annual';
        const ddKey = 'dd' + (++uid);

        const el = document.createElement('div');
        el.className = 'pcard' + (cfg.role === 'current' ? ' is-current' : '') + (cfg.role === 'recommended' ? ' is-rec' : '');
        const tag = cfg.role === 'current'
          ? `<span class="pcard-cur-tag">Current plan</span>`
          : (cfg.role === 'recommended' ? `<span class="pcard-badge">Recommended</span>` : '');
        const flag = cfg.flag ? `<div class="mp-flag mb-1 self-start"><i class="ph-fill ph-warning"></i>${cfg.flag}</div>` : '';

        el.innerHTML = `
          ${tag}
          <div class="flex items-center justify-between mb-4" style="min-height:34px">
            <span class="pcard-glyph">${glyph}</span>
            ${hasMonthly ? `<div class="mseg" data-mseg>
              <button class="mseg-btn" data-period="monthly">Monthly</button>
              <button class="mseg-btn is-active" data-period="annual">Annual</button>
            </div>` : ''}
          </div>
          <div class="flex items-baseline justify-between gap-2">
            <div>
              <h3>${name}</h3>
              <p class="text-[12px] font-semibold unlimited-grad mt-1">Unlimited seats</p>
            </div>
            <div class="text-right" data-price></div>
          </div>
          ${flag}
          <p class="text-[12px] font-medium text-ink-secondary mt-5 mb-2 inline-flex items-center gap-1">${cfg.mode === 'more' ? 'New credit pool' : 'How many credits?'}${TIP}</p>
          <div class="credit-dd" data-dd="${ddKey}">
            <button type="button" class="credit-dd-trigger" aria-haspopup="listbox" aria-expanded="false" aria-label="Credit pool size">
              <span class="credit-dd-left">${SPARK}<span class="credit-dd-value">${credits.toLocaleString()} credits</span></span>
              <i class="ph ph-caret-down credit-dd-caret" aria-hidden="true"></i>
            </button>
            <ul class="credit-dd-menu" role="listbox" aria-label="Credit pool size"></ul>
          </div>
          <div class="mt-4">
            <button class="pcard-cta ${cfg.role === 'recommended' ? 'primary' : 'ghost'}" data-cta>${cfg.cta}</button>
            <p class="text-[12px] font-medium text-center mt-2" data-hint></p>
          </div>
          <div class="flex flex-col gap-3.5 mt-5">${featsHTML(TEAM_FEATS[planKey])}</div>`;

        cardsEl.appendChild(el);

        const dd = el.querySelector(`[data-dd="${ddKey}"]`);
        const trigger = dd.querySelector('.credit-dd-trigger');
        const valueEl = dd.querySelector('.credit-dd-value');
        const menu = dd.querySelector('.credit-dd-menu');
        const priceEl = el.querySelector('[data-price]');
        const hintEl = el.querySelector('[data-hint]');
        const segBtns = Array.from(el.querySelectorAll('[data-mseg] .mseg-btn'));

        menu.innerHTML = options.map(c => `
          <li class="credit-dd-opt" role="option" data-value="${c}" aria-selected="${c === credits}">
            <span class="credit-dd-optlabel">${SPARK}${c.toLocaleString()} credits</span>
            <span class="credit-dd-pill">${offerPct(c)}% off</span>
          </li>`).join('');

        const opts = Array.from(menu.querySelectorAll('.credit-dd-opt'));
        let activeIdx = options.indexOf(credits);
        const highlight = () => opts.forEach((o, i) => o.classList.toggle('is-active', i === activeIdx));
        const open = () => { dd.classList.add('is-open'); trigger.setAttribute('aria-expanded', 'true'); activeIdx = options.indexOf(credits); highlight(); };
        const close = () => { dd.classList.remove('is-open'); trigger.setAttribute('aria-expanded', 'false'); };
        function choose(c) { credits = c; close(); render(); trigger.focus(); }

        trigger.addEventListener('click', () => dd.classList.contains('is-open') ? close() : open());
        opts.forEach((o, i) => {
          o.addEventListener('mouseenter', () => { activeIdx = i; highlight(); });
          o.addEventListener('click', () => choose(parseInt(o.dataset.value, 10)));
        });
        trigger.addEventListener('keydown', (e) => {
          if (['ArrowDown', 'ArrowUp', 'Enter', ' '].includes(e.key)) {
            e.preventDefault();
            if (!dd.classList.contains('is-open')) { open(); return; }
            if (e.key === 'ArrowDown')    { activeIdx = Math.min(opts.length - 1, activeIdx + 1); highlight(); }
            else if (e.key === 'ArrowUp') { activeIdx = Math.max(0, activeIdx - 1); highlight(); }
            else                          { choose(options[activeIdx]); }
          } else if (e.key === 'Escape') { close(); }
        });
        document.addEventListener('click', (e) => { if (!dd.contains(e.target)) close(); });

        function render() {
          valueEl.textContent = `${credits.toLocaleString()} credits`;
          opts.forEach(o => o.setAttribute('aria-selected', String(parseInt(o.dataset.value, 10) === credits)));
          const factor = period === 'monthly' ? 2 : 1;
          const baseNow = teamAnnualMo(planKey, credits), baseList = teamListMo(planKey, credits);
          const now = baseNow * factor, list = baseList * factor;
          const cadence = period === 'monthly'
            ? `${credits.toLocaleString()} credits · billed monthly`
            : `${credits.toLocaleString()} credits · $${(now * 12).toLocaleString()} billed annually`;
          priceEl.innerHTML = `
            <div class="flex items-baseline gap-2 justify-end">
              ${now < list ? `<p class="text-[14px] font-medium line-through text-ink-tertiary leading-none"><span class="usd">$</span>${list.toLocaleString()}</p>` : ''}
              <div class="flex items-baseline gap-1">
                <p class="text-[26px] font-bold text-ink-primary leading-none"><span class="usd">$</span>${now.toLocaleString()}</p>
                <span class="text-[13px] font-medium text-ink-tertiary">/mo</span>
              </div>
            </div>
            <p class="text-[12px] font-medium text-ink-tertiary mt-1">${cadence}</p>`;
          const savings = (baseList - baseNow) * 12;
          if (savings > 0) {
            hintEl.className = 'text-[12px] font-medium text-center mt-2 text-success-fg';
            hintEl.innerHTML = `<i class="ph-fill ph-check-circle text-[13px]"></i> You're saving $${savings.toLocaleString()} every year`;
          } else {
            hintEl.className = 'text-[12px] font-medium text-center mt-2 text-ink-tertiary';
            hintEl.textContent = 'Volume pricing scales with credits';
          }
          segBtns.forEach(b => b.classList.toggle('is-active', b.dataset.period === period));
        }
        segBtns.forEach(b => b.addEventListener('click', () => { period = b.dataset.period; render(); }));
        render();
      }

      // ── Enterprise card ──────────────────────────────────────────────────
      function buildEnterpriseCard() {
        const el = document.createElement('div');
        el.className = 'pcard';
        el.innerHTML = `
          <div class="flex items-center justify-between mb-4" style="min-height:34px">
            <span class="pcard-glyph">🛰️</span>
          </div>
          <h3>Enterprise</h3>
          <div class="flex flex-col items-center gap-2 mt-8 mb-4">
            <p class="trust-cap">Trusted by 1000+ enterprises</p>
            ${ENT_LOGOS}
          </div>
          <div class="mt-auto">
            <button class="pcard-cta ghost">Talk to Sales</button>
            <p class="text-[12px] font-medium text-ink-tertiary text-center mt-2">Tailored to your org &amp; security needs</p>
          </div>`;
        cardsEl.appendChild(el);
      }

      // ── Lock panel (team users can't go individual) ──────────────────────
      function buildLockPanel(planLabel) {
        const el = document.createElement('div');
        el.className = 'lock-panel';
        el.innerHTML = `
          <i class="ph ph-lock-simple"></i>
          <p class="text-[15px] font-semibold text-ink-primary">Individual plans aren't available on a team plan</p>
          <p class="text-[13px] text-ink-secondary max-w-[460px]">You're on <b>${planLabel}</b>. Team plans can't switch back to an individual plan. Stay on Teams &amp; Enterprise to grow credits or move up a tier.</p>`;
        cardsEl.appendChild(el);
      }

      // ── Render a full page for a (state, view) ───────────────────────────
      let currentStateKey = 'pro-ind', currentView = 'individual';

      function render() {
        const st = STATES[currentStateKey];
        document.getElementById('cur-banner-text').innerHTML = st.banner;
        cardsEl.innerHTML = '';

        if (currentView === 'individual') {
          if (st.kind === 'team') {
            buildLockPanel(st.plan === 'pro' ? 'Pro Team' : 'Gold Team');
            return;
          }
          // individual state: current plan + higher-tier upgrades only (no downgrades).
          const cur = st.plan;
          ['pro', 'gold'].forEach(pk => {
            if (pk === cur) buildIndividualCard(pk, 'current');
            else if (TIER[pk] > TIER[cur]) buildIndividualCard(pk, 'upgrade');
            // lower tier: not shown
          });
          buildEnterpriseCard();
        } else {
          // team view
          ['pro', 'gold'].forEach(pk => {
            let cfg;
            if (st.kind === 'team' && st.plan === pk) {
              cfg = { mode: 'more', owned: st.owned, role: 'current', cta: 'Buy more credits' };
            } else if (st.kind === 'team') {
              // other team plan: show only if it's a higher-tier upgrade
              if (TIER[pk] > TIER[st.plan]) {
                cfg = { mode: 'upgrade', role: 'recommended', cta: `Upgrade to ${pk === 'pro' ? 'Pro Team' : 'Gold Team'}` };
              } else {
                return; // lower tier: not shown
              }
            } else {
              // from an individual state -> team upgrades, no tier downgrades.
              // Pro can go to Pro Team or Gold Team; Gold can only go to Gold Team.
              if (TIER[pk] < TIER[st.plan]) return; // lower-tier team plan: not shown
              const rec = pk === 'gold';
              cfg = { mode: 'upgrade', role: rec ? 'recommended' : 'normal',
                      cta: pk === 'pro' ? 'Buy Pro Team' : 'Buy Gold Team' };
            }
            buildTeamCard(pk, cfg);
          });
          buildEnterpriseCard();
        }

        // Carry-forward / no-proration note: only when upgrading from an
        // individual plan to a team plan.
        const noteEl = document.getElementById('upgrade-note');
        const showNote = currentView === 'team' && st.kind === 'individual';
        noteEl.classList.toggle('hidden', !showNote);

        // Fit the grid to however many cards rendered (centered).
        const n = cardsEl.children.length;
        cardsEl.style.gridTemplateColumns = `repeat(${n}, minmax(0, 360px))`;
      }

      // ── Wire view toggle + proto state switcher ──────────────────────────
      const viewBtns = Array.from(document.querySelectorAll('.view-seg-btn'));
      viewBtns.forEach(b => b.addEventListener('click', () => {
        currentView = b.dataset.view;
        viewBtns.forEach(x => x.classList.toggle('is-active', x === b));
        render();
      }));
      function setView(v) {
        currentView = v;
        viewBtns.forEach(x => x.classList.toggle('is-active', x.dataset.view === v));
      }

      document.querySelectorAll('.proto-pill').forEach(p => p.addEventListener('click', () => {
        currentStateKey = p.dataset.state;
        document.querySelectorAll('.proto-pill').forEach(x => x.classList.toggle('is-active', x === p));
        // team states default to the team view
        setView(STATES[currentStateKey].kind === 'team' ? 'team' : 'individual');
        render();
      }));

      render();
    })();
  </script>

  <!-- Agentation: visual feedback toolbar. React via esm.sh CDN. -->
  <div id="agentation-root"></div>
  <script type="module">
    import React from 'https://esm.sh/react@18';
    import { createRoot } from 'https://esm.sh/react-dom@18/client';
    import { Agentation } from 'https://esm.sh/agentation@3?deps=react@18,react-dom@18';
    createRoot(document.getElementById('agentation-root'))
      .render(React.createElement(Agentation));
  </script>
</body>
</html>
