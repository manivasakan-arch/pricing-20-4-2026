<style>
  .v8-popup { max-width: 540px; background: #fdfcf8; }
  .v8-body { padding: 56px 44px 36px; }
  .v8-eyebrow {
    font-size: 11px; font-weight: 700; letter-spacing: 0.16em;

  .v8-eyebrow strong { color: #0055ED; }
  .v8-h {

  }
  .v8-lede {
    font-size: 14px; line-height: 1.65; color: #525252;
    margin: 12px 0 24px;
  }
  .v8-textarea {
    width: 100%; min-height: 140px;
    border: 0; border-bottom: 1px solid #d4dae2;
    padding: 0 0 12px; font-family: inherit; font-size: 16px; line-height: 1.55;
    resize: vertical; outline: none; color: #171717;
    background: transparent;

  .v8-textarea::placeholder { color: #b0b0b0; font-style: italic; }
  .v8-sign {
    font-family: "Instrument Serif", serif;
    font-style: italic;
    font-size: 16px; color: #525252;
    margin: 0 0 22px;

<div class="crazy8-tag"><strong>Variant 8</strong> · Letter / serif intimacy</div>
