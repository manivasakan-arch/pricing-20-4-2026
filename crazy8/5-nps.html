<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Crazy 8 · 5 · NPS + comment</title>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="_shared.css" />
<style>
  .v5-popup { max-width: 560px; }
  .v5-body { padding: 32px 28px 28px; }
  .v5-eyebrow {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    background: rgba(0,85,237,0.12); color: #0055ED;
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    margin-bottom: 14px;
  }
  .v5-h { font-size: 22px; font-weight: 600; line-height: 1.3; color: #171717; margin: 0 0 18px; }
  .v5-h strong { color: #0055ED; }

  .v5-scale {
    display: grid; grid-template-columns: repeat(11, 1fr);
    gap: 6px;
    margin-bottom: 8px;
  }
  .v5-cell {
    aspect-ratio: 1 / 1;
    border: 1px solid #e3e7ee; border-radius: 8px;
    background: #fff;
    font-size: 14px; font-weight: 600; color: #525252;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
  }
  .v5-cell:hover { border-color: #0055ED; color: #0055ED; }
  .v5-cell.on { background: #0055ED; color: #fff; border-color: #0055ED; }
  .v5-scale-foot {
    display: flex; justify-content: space-between;
    font-size: 11px; color: #8d8d8d;
    margin-bottom: 22px;
  }
  .v5-textarea {
    width: 100%; min-height: 88px;
    border: 1px solid #d4dae2; border-radius: 8px;
    padding: 12px 14px; font-family: inherit; font-size: 14px;
    resize: vertical; outline: none; color: #171717;
    margin-bottom: 8px;
  }
  .v5-textarea:focus { border-color: #0055ED; }
  .v5-textarea::placeholder { color: #a3a3a3; }
  .v5-foot-note { font-size: 11px; color: #8d8d8d; margin: 0 0 16px; }
</style>
</head>
<body>
<div class="crazy8-tag"><strong>Variant 5</strong> · NPS + comment</div>
<div class="popup v5-popup">
  <button class="popup-close" aria-label="Close"><i class="ph ph-x"></i></button>
  <div class="v5-body">
    <span class="v5-eyebrow">Score us → <span class="amt-blue" style="color:#0055ED">$60</span> back</span>
    <h2 class="v5-h">How likely are you to recommend us?</h2>
    <div class="v5-scale">
      <button class="v5-cell">0</button>
      <button class="v5-cell">1</button>
      <button class="v5-cell">2</button>
      <button class="v5-cell">3</button>
      <button class="v5-cell">4</button>
      <button class="v5-cell">5</button>
      <button class="v5-cell">6</button>
      <button class="v5-cell">7</button>
      <button class="v5-cell">8</button>
      <button class="v5-cell on">9</button>
      <button class="v5-cell">10</button>
    </div>
    <div class="v5-scale-foot">
      <span>Not likely</span>
      <span>Very likely</span>
    </div>
    <textarea class="v5-textarea" placeholder="Tell us why — one line is enough."></textarea>
    <p class="v5-foot-note">We may share your testimonial for marketing.</p>
    <button class="btn-primary"><i class="ph-fill ph-lock-open"></i>Submit and unlock $60 off</button>
  </div>
</div>
</body>
</html>
