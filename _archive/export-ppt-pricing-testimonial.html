  <style>
    html { font-family: Inter, system-ui, sans-serif; }
    body { background: #eef0f3; min-height: 100vh; margin: 0; }

    @keyframes ticker-scroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }
    .uni-ticker-track {
      display: flex;
      width: max-content;
      animation: ticker-scroll 40s linear infinite;
    }
    .uni-ticker-mask {
      mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
    }
    .uni-name {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 14px;
      color: #6F6F6F;
      letter-spacing: 0.06em;
      white-space: nowrap;
      padding: 0 28px;
      flex-shrink: 0;
    }

    @keyframes chip-shimmer {
      0%        { transform: translateX(-100%); }
      60%, 100% { transform: translateX(100%); }
    }
    @keyframes chip-icon-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .chip-icon-spin {
      animation: chip-icon-spin 2s linear infinite;
      transform-origin: center;
    }

    /* Text shimmer — bright sweep moves left → right across the text glyphs */
    @keyframes text-shimmer-sweep {
      0%   { background-position: 200% 0; }
      30%  { background-position: -100% 0; }
      100% { background-position: -100% 0; }
    }
    .text-shimmer {
      background-image: linear-gradient(
        110deg,
        #16a34a 30%,
        #86efac 50%,
        #16a34a 70%
      );
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: text-shimmer-sweep 3.5s ease-out infinite;
    }
    .chip-shimmer {
      overflow: hidden;
      background-color: #16a34a;
    }
    .chip-shimmer::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: linear-gradient(
        100deg,
        transparent 35%,
        rgba(255, 255, 255, 0.6) 50%,
        transparent 65%
      );
      transform: translateX(-100%);
      animation: chip-shimmer 3.2s ease-in-out infinite;
      pointer-events: none;
    }

    /* Currency symbol — scales relative to price size */
    .usd {
      font-size: 0.45em;
      font-weight: 600;
      vertical-align: 0.45em;
      margin-right: 2px;
      letter-spacing: 0;
    }

    @keyframes reveal-fade {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .reveal { animation: reveal-fade 220ms ease-out both; }

    /* ---- Nudge chip (post-bump) — copied from pricing-20-4-2026 reference ---- */
    .pro-discount-chip {
      position: relative;
      display: inline-flex; align-items: center; gap: 6px;
      background: #ff5500; color: #ffffff;
      font-size: 11px; font-weight: 800; letter-spacing: 0.06em;
      padding: 5px 12px; border-radius: 999px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      animation: pro-chip-bob 2.6s ease-in-out infinite,
                 pro-chip-glow 2.2s ease-in-out infinite;
    }
    .pro-discount-chip i { font-size: 12px; color: #ffffff; }
    @keyframes pro-chip-bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-3px); }
    }
    @keyframes pro-chip-glow {
      0%, 100% { box-shadow: 0 4px 10px rgba(0,0,0,0.18),
                             0 0 0 0   rgba(255, 85, 0, 0.55); }
      70%      { box-shadow: 0 4px 10px rgba(0,0,0,0.18),
                             0 0 0 9px rgba(255, 85, 0, 0); }
      100%     { box-shadow: 0 4px 10px rgba(0,0,0,0.18),
                             0 0 0 0   rgba(255, 85, 0, 0); }
    }

    /* ---- Feedback modal (close-intent survey → bumps discount) ---- */
    /* Copied verbatim from pricing-20-4-2026/index.html */
    .fb-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;

    const BUMP_DURATION_MS = 60 * 60 * 1000; // 60 minutes
    const formatTimer = (ms) => {
      const totalSec = Math.max(0, Math.floor(ms / 1000));
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    };

    function Page() {
      const [discountTier, setDiscountTier] = useState("base"); // "base" | "bumped"
      const [audience, setAudience] = useState("edu"); // "edu" | "tier1"
      const [feedbackOpen, setFeedbackOpen] = useState(false);
      const [feedbackSubmitted, setFeedbackSubmitted] = useState(false);
      const [bumpStart, setBumpStart] = useState(null);
      const [now, setNow] = useState(Date.now());

      // Pre-success preview countdown (so the success step has a live ticker
      // even before the user clicks "See your offers")
      useEffect(() => {
        if (!feedbackOpen && bumpStart === null) return;
        const id = setInterval(() => setNow(Date.now()), 1000);
        return () => clearInterval(id);
      }, [feedbackOpen, bumpStart]);

      // Auto-revert when timer expires
      useEffect(() => {
        if (bumpStart === null) return;
        const elapsed = now - bumpStart;
        if (elapsed >= BUMP_DURATION_MS && discountTier === "bumped") {
          setDiscountTier("base");
        }
      }, [now, bumpStart, discountTier]);

      const remainingMs = bumpStart === null
        ? BUMP_DURATION_MS - 1000   // shows 59:59 in success step before claim
        : Math.max(0, BUMP_DURATION_MS - (now - bumpStart));
      const timerLabel = formatTimer(remainingMs);

      const oneTime = audience === "tier1"
        ? ONE_TIME_TIER1_BASE
        : (discountTier === "bumped" ? ONE_TIME_BUMPED : ONE_TIME_BASE);
      const unlimited = audience === "tier1"
        ? UNLIMITED_TIER1_BASE
        : (discountTier === "bumped" ? UNLIMITED_BUMPED : UNLIMITED_BASE);
      const testimonial = audience === "tier1" ? TESTIMONIAL_TIER1 : TESTIMONIAL;
      const extraOneTime = ONE_TIME_BASE.price - ONE_TIME_BUMPED.price; // 49 - 9 = 40
      const extraUnlimited = UNLIMITED_BASE.studentPriceMonthly - UNLIMITED_BUMPED.studentPriceMonthly; // 14 - 10 = 4

      const handleClose = () => {
        if (!feedbackSubmitted) {
          setFeedbackOpen(true);
        }
        // else: no-op — gallery context, modals stay rendered
      };

      const handleFeedbackSubmit = () => {
        setFeedbackSubmitted(true);
        setDiscountTier("bumped");
        setBumpStart(Date.now());
        setNow(Date.now());
        setFeedbackOpen(false);
      };

      const handleFeedbackClose = () => {
        setFeedbackOpen(false);
      };

      const ctx = {
        oneTime,
        unlimited,
        testimonial,
        discountTier,
        audience,
        timerLabel,
        extraOneTime,
        extraUnlimited,
        handleClose,
      };

      return (
        <PricingContext.Provider value={ctx}>
          {/* Dashboard backdrop loaded behind the modal */}
          <iframe
            src="dashboard-flash-sale-bg.html"
            title="Dashboard backdrop"
            className="fixed inset-0 w-screen h-screen border-0 pointer-events-none"
            style={{ zIndex: 0 }}
          />
          {/* Black opacity scrim */}
          <div
            className="fixed inset-0 bg-black/50"
            style={{ zIndex: 1 }}
          />
          {/* Variation A modal centered above */}
          <div
            className="relative min-h-screen py-16 px-6 flex flex-col items-center justify-center"
            style={{ zIndex: 2 }}
          >
            <Layout08BShell Cards={CardsImagePlan} />
          </div>
          <FeedbackModal
            open={feedbackOpen}
            onSubmit={handleFeedbackSubmit}
            onClose={handleFeedbackClose}
            timerLabel={timerLabel}
          />
          {/* Audience toggle (debug) — flips between EDU and Tier 1 pricing */}
          <div
            className="fixed top-4 left-1/2 -translate-x-1/2 bg-white rounded-xl p-2 flex items-center gap-1 border border-gray-200"
            style={{ zIndex: 9999, boxShadow: "0 8px 24px rgba(0,0,0,0.18), 0 2px 6px rgba(0,0,0,0.10)" }}
          >
            <span className="text-[10px] font-bold uppercase tracking-[0.12em] text-gray-400 px-2">Audience</span>
            {[
              { key: "edu",   label: "EDU"    },
              { key: "tier1", label: "Tier 1" },
            ].map((opt) => {
              const on = audience === opt.key;
              return (
                <button
                  key={opt.key}
                  onClick={() => setAudience(opt.key)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${on ? "bg-[#ff5500] text-white" : "bg-gray-100 text-gray-600 hover:bg-gray-200"}`}
                >
                  {opt.label}
                </button>
              );
            })}
          </div>
        </PricingContext.Provider>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
  </script>

  <div id="agentation-root"></div>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
        "react/jsx-dev-runtime": "https://esm.sh/react@18.3.1/jsx-dev-runtime",
        "react-dom": "https://esm.sh/react-dom@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
      }
    }
  </script>
  <script type="module">
    import React from "react";
    import { createRoot } from "react-dom/client";
    import { Agentation } from "https://esm.sh/agentation@3?external=react,react-dom";
    createRoot(document.getElementById("agentation-root"))
      .render(React.createElement(Agentation));
  </script>
</body>
