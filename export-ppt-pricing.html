  <style>
    html { font-family: Inter, system-ui, sans-serif; }
    body { background: #eef0f3; min-height: 100vh; margin: 0; }

    @keyframes ticker-scroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }
    .uni-ticker-track {
      display: flex;
      width: max-content;
      animation: ticker-scroll 40s linear infinite;
    }
    .uni-ticker-mask {
      mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black 8%, black 92%, transparent);
    }
    .uni-name {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 14px;
      color: #6F6F6F;
      letter-spacing: 0.06em;
      white-space: nowrap;
      padding: 0 28px;
      flex-shrink: 0;
    }
    /* Logo strip pinned to viewport bottom on mobile — content scrolls behind it */
    @media (max-width: 767px) {
      .logo-strip-mobile-sticky {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 40;
        box-shadow: 0 -6px 18px rgba(0,0,0,0.08);
      }
      /* Reserve space at modal bottom so last card features don't hide behind logo strip */
      .offer-modal-shell { padding-bottom: 80px; }
    }
    .logo-img {
      height: 40px;
      width: auto;
      padding: 0 18px;
      flex-shrink: 0;
      opacity: 0.6;
      filter: grayscale(100%);
      object-fit: contain;
    }

    @keyframes chip-shimmer {
      0%        { transform: translateX(-100%); }
      60%, 100% { transform: translateX(100%); }
    }
    @keyframes chip-icon-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .chip-icon-spin {
      animation: chip-icon-spin 2s linear infinite;
      transform-origin: center;
    }

    /* Text shimmer — bright sweep moves left → right across the text glyphs */
    @keyframes text-shimmer-sweep {
      0%   { background-position: 200% 0; }
      30%  { background-position: -100% 0; }
      100% { background-position: -100% 0; }
    }
    .text-shimmer {
      background-image: linear-gradient(
        110deg,
        #16a34a 30%,
        #86efac 50%,
        #16a34a 70%
      );
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: text-shimmer-sweep 3.5s ease-out infinite;
    }
    .chip-shimmer {
      overflow: hidden;
      background-color: #16a34a;
    }
    .chip-shimmer::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: linear-gradient(
        100deg,
        transparent 35%,
        rgba(255, 255, 255, 0.6) 50%,
        transparent 65%
      );
      transform: translateX(-100%);
      animation: chip-shimmer 3.2s ease-in-out infinite;
      pointer-events: none;
    }

    /* Currency symbol — scales relative to price size */
    .usd {
      font-size: 0.45em;
      font-weight: 600;
      vertical-align: 0.45em;
      margin-right: 2px;
      letter-spacing: 0;
    }

    @keyframes reveal-fade {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .reveal { animation: reveal-fade 220ms ease-out both; }

    /* ---- Nudge chip (post-bump) — copied from pricing-20-4-2026 reference ---- */
    .pro-discount-chip {
      position: relative;
      display: inline-flex; align-items: center; gap: 6px;
      background: #0055ED; color: #ffffff;
      font-size: 11px; font-weight: 800; letter-spacing: 0.06em;
      padding: 5px 12px; border-radius: 999px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      animation: pro-chip-bob 2.6s ease-in-out infinite,
                 pro-chip-glow 2.2s ease-in-out infinite;
    }
    .pro-discount-chip i { font-size: 12px; color: #ffffff; }
    @keyframes pro-chip-bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-3px); }
    }
    @keyframes pro-chip-glow {
      0%, 100% { box-shadow: 0 4px 10px rgba(0,0,0,0.18),
                             0 0 0 0   rgba(0, 85, 237, 0.55); }
      70%      { box-shadow: 0 4px 10px rgba(0,0,0,0.18),
                             0 0 0 9px rgba(0, 85, 237, 0); }
      100%     { box-shadow: 0 4px 10px rgba(0,0,0,0.18),
                             0 0 0 0   rgba(0, 85, 237, 0); }
    }

    /* ---- Feedback modal (close-intent survey → bumps discount) ---- */
    /* Copied verbatim from pricing-20-4-2026/index.html */
    .fb-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }
    .fb-backdrop[data-open="true"] {
      opacity: 1;
      pointer-events: auto;
    }
    .fb-card {
      width: 620px;
      max-width: calc(100vw - 48px);
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25), 0 2px 6px rgba(0,0,0,0.1);
      transform: translateY(12px);
      transition: transform .22s ease;
      position: relative;
    }
    .fb-survey-wrap { border-radius: 4px; overflow: hidden; }
    .fb-backdrop[data-open="true"] .fb-card { transform: translateY(0); }
    .fb-dialog-wrap { position: relative; }
    .fb-close {
      position: absolute;
      top: -20px; right: -20px;
      width: 40px; height: 40px; border-radius: 999px;
      display: inline-flex; align-items: center; justify-content: center;
      background: #ffffff;
      color: #171717;
      box-shadow: 0 4px 14px rgba(0,0,0,0.22);
      transition: transform .15s ease, background .15s;
      z-index: 2;
      border: 0;
      cursor: pointer;
    }
    .fb-close:hover { transform: scale(1.06); background: #f5f5f5; }
    .fb-survey-wrap { display: grid; grid-template-columns: 240px 1fr; }
    .fb-panel-left {
      padding: 30px 26px 28px;
      position: relative; overflow: hidden;
      display: flex; flex-direction: column; justify-content: space-between;
      background: #ffeee5;
      color: #171717;
    }
    .fb-panel-left::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at bottom left, rgba(255,85,0,0.22), transparent 60%);
      z-index: 0;
    }
    .fb-panel-left > * { position: relative; z-index: 2; }
    .fb-gift {
      font-size: 56px; line-height: 1; display: inline-block;
      margin-bottom: 18px;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.12));
      animation: fb-gift-bounce 1.8s ease-in-out infinite;
    }
    @keyframes fb-gift-bounce {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }
    .fb-tag {
      display: inline-flex; align-items: center;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      background: rgba(10, 25, 37, 0.08);
      color: #525252;
      margin-bottom: 12px;
    }
    .fb-panel-title {
      display: flex; flex-direction: column; align-items: flex-start;
      margin-top: 4px; line-height: 1.1;
      letter-spacing: -0.02em;
      font-size: 22px; font-weight: 600; color: #171717;
    }
    .fb-panel-sub {
      font-size: 12px; line-height: 1.55; color: #525252;
      margin-top: 10px;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .fb-panel-sub .arrow {
      color: #525252;
      display: inline-flex;
      animation: fb-arrow-pulse 1.4s ease-in-out infinite;
    }
    @keyframes fb-arrow-pulse {
      0%, 100% { transform: translateX(0); opacity: 0.8; }
      50%      { transform: translateX(5px); opacity: 1; }
    }
    .fb-conf {
      position: absolute;
      opacity: 0.7;
      z-index: 1;
      animation-name: fb-float-drift;
      animation-iteration-count: infinite;
      animation-timing-function: ease-in-out;
    }
    @keyframes fb-float-drift {
      0%, 100% { transform: translate(0,0) rotate(var(--r, 0deg)); }
      50%      { transform: translate(var(--tx, 0), var(--ty, -10px)) rotate(calc(var(--r, 0deg) + 15deg)); }
    }
    .fb-right-col { padding: 32px 32px 28px; }

    /* === Testimonial single-col modal shell (ported from testimonial.html) === */
    .t-offer-nudge {
      position: relative;
      width: 520px; max-width: calc(100vw - 48px);
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      display: flex; flex-direction: column;
      box-shadow: 0 30px 60px -12px rgba(0,0,0,0.35), 0 18px 36px -18px rgba(0,0,0,0.40);
      animation: t-nudge-pop 0.45s cubic-bezier(0.34, 1.35, 0.64, 1);
    }
    @keyframes t-nudge-pop {
      0%   { transform: scale(0.92); opacity: 0; }
      100% { transform: scale(1);    opacity: 1; }
    }
    .t-nudge-header {
      position: relative;
      height: 180px;
      flex-shrink: 0;
      overflow: hidden;
      background: linear-gradient(164.93deg, #d4dae2 0%, #eef2f6 71.43%);
    }
    .t-nudge-header-row {
      position: absolute;
      top: 50%;
      left: 30px;
      transform: translateY(-50%);
      display: flex;
      align-items: flex-end;
      gap: 30px;
      z-index: 2;
    }
    .t-gift-emoji {
      font-size: 68px;
      line-height: 1;
      display: inline-block;
      animation: t-gift-bounce 1.8s ease-in-out infinite;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.10));
    }
    @keyframes t-gift-bounce {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    .t-nudge-copy { display: flex; flex-direction: column; gap: 12px; }
    .t-nudge-copy .t-price-line { margin-top: 0; gap: 12px; }
    .t-badge {
      display: inline-flex; align-items: center;
      align-self: flex-start;
      background: rgba(10, 25, 37, 0.08);
      color: #525252;
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      padding: 5px 10px;
      border-radius: 4px;
    }
    .t-price-line {
      display: flex; flex-direction: column; align-items: flex-start;
      line-height: 1; letter-spacing: -0.02em; margin-top: 4px;
    }
    .t-price-line .t-amt {
      font-size: 36px; font-weight: 800;
      line-height: 40px; height: 40px;
      color: #0A1925;
      display: inline-flex; align-items: stretch;
    }
    .t-price-line .t-amt-real {
      display: inline-flex; align-items: stretch;
      color: #0A1925;
    }
    .t-price-line .t-amt .t-sym {
      font-size: 22px; font-weight: 700;
      line-height: 40px; padding-top: 2px; margin-right: 1px;
      display: inline-block; color: #0A1925;
    }
    /* V8 — Slow drift dial. Multi-rotation digit columns with edge mask + blur reveal. */
    .t-digits { display: inline-flex; gap: 4px; height: 40px; }
    .t-digit {
      display: inline-block;
      position: relative;
      width: 26px; height: 40px;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 30%, #000 70%, transparent 100%);
              mask-image: linear-gradient(to bottom, transparent 0%, #000 30%, #000 70%, transparent 100%);
    }
    .t-digit-track {
      display: block;
      transform: translateY(0);
      transition: transform 4s cubic-bezier(0.16, 1, 0.3, 1), filter 3.6s ease-out;
    }
    .t-digit:nth-child(2) .t-digit-track {
      transition: transform 4.2s cubic-bezier(0.16, 1, 0.3, 1), filter 3.8s ease-out;
    }
    .t-digit-track > span {
      display: block;
      height: 40px; line-height: 40px;
      text-align: center;
      font-weight: 800;
      color: #0A1925;
    }
    /* Initial "00" is blurred during hold; blur clears as spin begins */
    .t-amt[data-price-loading="true"]  .t-digit-track { filter: blur(6px); }
    .t-amt[data-price-loading="false"] .t-digit-track { filter: blur(0); }
    .t-price-line .t-lbl {
      font-size: 22px; font-weight: 500; color: #171717;
      margin-top: 0; line-height: 1.15;
    }
    .t-conf {
      position: absolute; pointer-events: none; z-index: 1;
      animation: t-conf-drift 4.6s ease-in-out infinite;
    }
    @keyframes t-conf-drift {
      0%, 100% { transform: translate(0,0) rotate(var(--r, 0deg)); }
      50%      { transform: translate(var(--tx, 0), var(--ty, -8px)) rotate(calc(var(--r, 0deg) + 12deg)); }

      const wasDisabledRef = useRef(true);

      // Reset state whenever the modal opens

        if (open) {
          setFeeling(null);

          if (quoteRef.current) quoteRef.current.textContent = "";

      // V8 Slow Drift dial — hold blurred 1.2s, then dreamy multi-rotation slide

        if (!open) return;
        const DIGIT_H = 40;

        const digits = Array.from(document.querySelectorAll('.t-digit[data-target]'));
        if (!digits.length) return;

        // Build tracks (cycles + 1 final stretch of 0..9)
        digits.forEach((digit, i) => {
          const track = digit.querySelector('.t-digit-track');
          if (!track) return;
          track.innerHTML = '';
          const totalCycles = cycleCounts[i] + 1;
          for (let c = 0; c < totalCycles; c++) {
            for (let n = 0; n <= 9; n++) {
              const span = document.createElement('span');
              span.textContent = String(n);
              track.appendChild(span);
            }
          }
          track.dataset.cycles = String(cycleCounts[i]);
          track.style.transition = 'none';
          track.style.transform = 'translateY(0)';
        });

        // Set loading state for blur
        const amtEls = document.querySelectorAll('.t-amt');
        amtEls.forEach((el) => { el.dataset.priceLoading = 'true'; });

        // Force reflow then restore CSS transitions
        void document.body.offsetWidth;
        digits.forEach((digit) => {
          const track = digit.querySelector('.t-digit-track');
          if (track) track.style.transition = '';
        });

        // After 1.2s hold, clear blur + slide to target
        const holdId = setTimeout(() => {
          amtEls.forEach((el) => { el.dataset.priceLoading = 'false'; });
          digits.forEach((digit) => {
            const track = digit.querySelector('.t-digit-track');
            if (!track) return;
            const target = parseInt(digit.dataset.target || '0', 10);
            const cycles = parseInt(track.dataset.cycles || '0', 10);
            const offset = (cycles * 10 + target) * DIGIT_H;
            track.style.transform = `translateY(-${offset}px)`;
          });
        }, 1200);

        return () => clearTimeout(holdId);
      }, [open]);

      const submitDisabled = !quote.trim();

      // Lock-pop + shine fire when CTA flips disabled → enabled
      useEffect(() => {
        const btn = submitBtnRef.current;
        if (!btn) return;
        if (wasDisabledRef.current && !submitDisabled) {
          btn.classList.remove("just-unlocked");
          void btn.offsetWidth;
          btn.classList.add("just-unlocked");
        }
        wasDisabledRef.current = submitDisabled;
      }, [submitDisabled]);

      const handleSubmit = () => {
        if (submitDisabled) return;
        setStep("success");
      };

      const handleClaim = () => {
        onSubmit(); // parent flips discountTier + closes modal + starts timer
      };

      const onPickFeeling = (f) => {
        const q = pickRandomQuoteT(f.label);
        setFeeling(f.label);
        setQuote(q);
        if (quoteRef.current) quoteRef.current.textContent = q;
      };

      const onQuoteInput = (e) => {
        const txt = e.currentTarget.textContent;
        setQuote(txt);
        if (!txt.trim()) setFeeling(null);
      };

      const trackChips = [...FEELINGS, ...FEELINGS]; // doubled for seamless marquee

      return (
        <div className="fb-backdrop" data-open={open ? "true" : "false"} role="dialog" aria-modal="true" aria-labelledby="fb-title">
          <div className="fb-dialog-wrap">
            <button className="fb-close" onClick={onClose} aria-label="Close">
              <i className="ph ph-x" style={{ fontSize: 18 }}></i>
            </button>
            <div className="t-offer-nudge">
              {/* Orange header on top */}
              <div className="t-nudge-header">
                <span className="t-conf" style={{ top: 10,  left: 60,  width: 6,  height: 6,  borderRadius: 999, background: "#4285f4", "--r": "0deg",   "--tx": "-3px", "--ty": "-8px",  animationDuration: "5.4s", animationDelay: "-1.4s" }}></span>
                <span className="t-conf" style={{ top: 12,  left: 200, width: 5,  height: 5,  borderRadius: 999, background: "#16a34a", "--r": "0deg",   "--tx": "3px",  "--ty": "-10px", animationDuration: "5s",   animationDelay: "-2.2s" }}></span>
                <span className="t-conf" style={{ top: 14,  left: 382, width: 10, height: 16, background: "#ff5500", "--r": "22deg",  "--tx": "-6px", "--ty": "-8px",  animationDuration: "4.2s", animationDelay: "-0.3s" }}></span>
                <span className="t-conf" style={{ top: 32,  left: 432, width: 6,  height: 6,  borderRadius: 999, background: "#4285f4", "--r": "0deg",   "--tx": "4px",  "--ty": "-12px", animationDuration: "5.5s", animationDelay: "-1.1s" }}></span>
                <span className="t-conf" style={{ top: 80,  left: 472, width: 7,  height: 11, background: "#ff732d", "--r": "12deg",  "--tx": "-4px", "--ty": "-10px", animationDuration: "5.2s", animationDelay: "-1.6s" }}></span>
                <span className="t-conf" style={{ top: 60,  left: 478, width: 8,  height: 8,  borderRadius: 999, background: "#16a34a", "--r": "0deg",   "--tx": "6px",  "--ty": "-14px", animationDuration: "6s",   animationDelay: "-2s" }}></span>
                <span className="t-conf" style={{ bottom: 18, left: 432, width: 10, height: 16, background: "#fbbc04", "--r": "-30deg", "--tx": "-5px", "--ty": "-9px",  animationDuration: "4.8s", animationDelay: "-0.6s" }}></span>
                <span className="t-conf" style={{ bottom: 60, left: 6,   width: 5,  height: 5,  borderRadius: 999, background: "#fbbc04", "--r": "0deg",   "--tx": "-3px", "--ty": "-10px", animationDuration: "5.6s", animationDelay: "-2.4s" }}></span>

                <div className="t-nudge-header-row">
                  <span className="t-gift-emoji">🎁</span>
                  <div className="t-nudge-copy">
                    <span className="t-badge" id="fb-title">
                      {step === "form" ? "Share Feedback and Get" : "Thank you"}
                    </span>
                    <div className="t-price-line">
                      <span className="t-amt" data-price-loading="true">
                        <span className="t-amt-real">
                          {!isEdu && <span className="t-sym">$</span>}
                          <span className="t-digits">
                            <span className="t-digit" data-target={isEdu ? "5" : "6"}><span className="t-digit-track"></span></span>
                            <span className="t-digit" data-target="0"><span className="t-digit-track"></span></span>
                          </span>
                          {isEdu && <span style={{ fontSize: "22px", lineHeight: "40px", paddingTop: "2px", marginLeft: 2, color: "#0055ED", display: "inline-block" }}>%</span>}
                        </span>
                      </span>
                      <span className="t-lbl">{step === "success" ? "off Pro Annual Unlocked" : "off Pro Annual"}</span>
                    </div>
                  </div>
                </div>
              </div>

              {/* Body */}
              <div className="t-body">
                {step === "form" && (
                  <div>
                    <h3 className="t-heading" style={{ marginBottom: 12, fontSize: 16, fontWeight: 600 }}>Your feedback</h3>

                    <div className={"t-input-card" + (feeling || quote.trim() ? " picked" : "")}>
                      <div
                        ref={quoteRef}
                        className="t-quote"
                        contentEditable
                        suppressContentEditableWarning
                        role="textbox"
                        aria-multiline="true"
                        data-placeholder="Tap a feeling — or type your own testimonial."
                        onInput={onQuoteInput}
                      ></div>
                      <div className="t-emoji-row">
                        <div className="t-emoji-track">
                          {trackChips.map((f, i) => (
                            <button
                              key={i}
                              type="button"
                              className={"t-emoji-chip" + (feeling === f.label ? " active" : "")}
                              title={f.label}
                              onClick={() => onPickFeeling(f)}
                            >
                              <span className="em">{f.em}</span><span className="lbl">{f.label}</span>
                            </button>
                          ))}
                        </div>
                      </div>
                    </div>

                    <button ref={submitBtnRef} className="fb-btn-primary" style={{ width: "100%", marginTop: 16 }} disabled={submitDisabled} onClick={handleSubmit}>
                      <span className="fb-lock" aria-hidden="true">
                        <i className="ph-fill ph-lock"></i>
                        <i className="ph-fill ph-lock-open"></i>
                      </span>
                      Submit feedback and unlock discount
                    </button>

                    <p className="t-disclaimer" style={{ textAlign: "center", marginTop: 12 }}>We may share your testimonial for marketing.</p>
                  </div>
                )}
                {step === "success" && (
                  <div style={{ position: "relative" }}>
                    <p className="t-success-body">
                      We heard you. As a token of appreciation, we've unlocked <strong>{offerLabel}</strong> for the next <strong>hour</strong>.
                    </p>
                    <div className="fb-actions fb-cta-wrap" style={{ marginTop: 36 }}>
                      <span className="fb-cta-badge" aria-hidden="true">
                        <i className="ph-fill ph-clock"></i>
                        Ends in <span className="fb-btn-timer">{timerLabel}</span>
                      </span>
                      <button className="fb-btn-primary" onClick={handleClaim}>
                        Buy Pro Annual at $60 off
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ---------- page ---------- */

    const BUMP_DURATION_MS = 60 * 60 * 1000; // 60 minutes
    const formatTimer = (ms) => {
      const totalSec = Math.max(0, Math.floor(ms / 1000));
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    };

    function Page() {
      const [discountTier, setDiscountTier] = useState("base"); // "base" | "bumped"
      const [audience, setAudience] = useState("tier1"); // "tier1" | "edu"
      const [feedbackOpen, setFeedbackOpen] = useState(false);
      const [feedbackSubmitted, setFeedbackSubmitted] = useState(false);
      const [bumpStart, setBumpStart] = useState(null);
      const [now, setNow] = useState(Date.now());

      // Pre-success preview countdown (so the success step has a live ticker
      // even before the user clicks "See your offers")
      useEffect(() => {
        if (!feedbackOpen && bumpStart === null) return;
        const id = setInterval(() => setNow(Date.now()), 1000);
        return () => clearInterval(id);
      }, [feedbackOpen, bumpStart]);

      // Auto-revert when timer expires
      useEffect(() => {
        if (bumpStart === null) return;
        const elapsed = now - bumpStart;
        if (elapsed >= BUMP_DURATION_MS && discountTier === "bumped") {
          setDiscountTier("base");
        }
      }, [now, bumpStart, discountTier]);

      const remainingMs = bumpStart === null
        ? BUMP_DURATION_MS - 1000   // shows 59:59 in success step before claim
        : Math.max(0, BUMP_DURATION_MS - (now - bumpStart));
      const timerLabel = formatTimer(remainingMs);

      // Single PPT never discounts — always use base price across all tabs
      const oneTime = audience === "tier1" ? ONE_TIME_TIER1_BASE : ONE_TIME_BASE;
      const unlimited = audience === "tier1"
        ? (discountTier === "bumped" ? UNLIMITED_TIER1_BUMPED : UNLIMITED_TIER1_BASE)
        : (discountTier === "bumped" ? UNLIMITED_BUMPED : UNLIMITED_BASE);
      const testimonial = audience === "tier1" ? TESTIMONIAL_TIER1 : TESTIMONIAL;
      const extraOneTime = audience === "tier1"
        ? ONE_TIME_TIER1_BASE.price - ONE_TIME_TIER1_BUMPED.price            // 119 - 49 = 70
        : ONE_TIME_BASE.price - ONE_TIME_BUMPED.price;                       // 49 - 9 = 40
      const extraUnlimited = audience === "tier1"
        ? (UNLIMITED_TIER1_BASE.studentPriceMonthly - UNLIMITED_TIER1_BUMPED.studentPriceMonthly) * 12  // 5 × 12 = 60 annual
        : (UNLIMITED_BASE.studentPriceMonthly - UNLIMITED_BUMPED.studentPriceMonthly) * 12;             // 5 × 12 = 60 annual

      const handleClose = () => {
        if (!feedbackSubmitted) {
          setFeedbackOpen(true);
        }
        // else: no-op — gallery context, modals stay rendered
      };

      const handleFeedbackSubmit = () => {
        setFeedbackSubmitted(true);
        setDiscountTier("bumped");
        setBumpStart(Date.now());
        setNow(Date.now());
        setFeedbackOpen(false);
      };

      const handleFeedbackClose = () => {
        // Close without submitting → still apply discount on Pro Plan card.
        setFeedbackSubmitted(true);
        setDiscountTier("bumped");
        setBumpStart(Date.now());
        setNow(Date.now());
        setFeedbackOpen(false);
      };

      const ctx = {
        oneTime,
        unlimited,
        testimonial,
        discountTier,
        audience,
        timerLabel,
        extraOneTime,
        extraUnlimited,
        handleClose,
      };

      return (
        <PricingContext.Provider value={ctx}>
          {/* Dashboard backdrop loaded behind the modal */}
          <iframe
            src="_archive/dashboard-flash-sale-bg.html"
            title="Dashboard backdrop"
            className="fixed inset-0 w-screen h-screen border-0 pointer-events-none"
            style={{ zIndex: 0 }}
          />
          {/* Black opacity scrim */}
          <div
            className="fixed inset-0 bg-black/50"
            style={{ zIndex: 1 }}
          />
          {/* Variation A modal centered above */}
          <div
            className="relative min-h-screen py-6 px-3 md:py-16 md:px-6 flex flex-col items-center justify-center"
            style={{ zIndex: 2 }}
          >
            <Layout08BShell Cards={CardsImagePlan} />
          </div>
          <FeedbackModal
            open={feedbackOpen}
            onSubmit={handleFeedbackSubmit}
            onClose={handleFeedbackClose}
            timerLabel={timerLabel}
            audience={audience}
          />
          {/* Audience toggle (debug) — flips between EDU and Tier 1 pricing */}
          <div
            className="fixed top-4 left-1/2 -translate-x-1/2 bg-white rounded-xl p-2 flex items-center gap-1 border border-gray-200"
            style={{ zIndex: 9999, boxShadow: "0 8px 24px rgba(0,0,0,0.18), 0 2px 6px rgba(0,0,0,0.10)" }}
          >
            <span className="text-[10px] font-bold uppercase tracking-[0.12em] text-gray-400 px-2">Audience</span>
            {[
              { key: "tier1",     label: "Offer not seen" },
              { key: "tier1seen", label: "Offer seen"     },
              { key: "edu",       label: "EDU"            },
            ].map((opt) => {
              const isTier1 = opt.key === "tier1" || opt.key === "tier1seen";
              const on = isTier1
                ? (audience === "tier1" && (opt.key === "tier1seen" ? discountTier === "bumped" : discountTier === "base"))
                : audience === opt.key;
              const handleClick = () => {
                if (opt.key === "tier1seen") {
                  setAudience("tier1");
                  setDiscountTier("bumped");
                  setBumpStart(Date.now());
                  setNow(Date.now());
                  setFeedbackSubmitted(true);
                  setFeedbackOpen(false);
                } else if (opt.key === "tier1") {
                  setAudience("tier1");
                  setDiscountTier("base");
                  setBumpStart(null);
                  setFeedbackSubmitted(false);
                  setFeedbackOpen(false);
                } else {
                  setAudience("edu");
                  setDiscountTier("base");
                  setBumpStart(null);
                  setFeedbackSubmitted(false);
                  setFeedbackOpen(false);
                }
              };
              return (
                <button
                  key={opt.key}
                  onClick={handleClick}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${on ? "bg-[#0055ED] text-white" : "bg-gray-100 text-gray-600 hover:bg-gray-200"}`}
                >
                  {opt.label}
                </button>
              );
            })}
          </div>
        </PricingContext.Provider>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
  </script>

  <div id="agentation-root"></div>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
        "react/jsx-dev-runtime": "https://esm.sh/react@18.3.1/jsx-dev-runtime",
        "react-dom": "https://esm.sh/react-dom@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
      }
    }
  </script>
  <script type="module">
    import React from "react";
    import { createRoot } from "react-dom/client";
    import { Agentation } from "https://esm.sh/agentation@3?external=react,react-dom";
    createRoot(document.getElementById("agentation-root"))
      .render(React.createElement(Agentation));
  </script>
</body>
</html>
